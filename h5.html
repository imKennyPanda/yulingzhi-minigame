<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>田径大赛 H5 · 分与合 + 拼音练习</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(180deg, #FFF1F8 0%, #FFE4F2 40%, #DCD9FF 100%);
    color: #3D3350; overscroll-behavior: none;
  }
  .app { max-width: 720px; margin: 0 auto; padding: 10px 12px 24px; }

  /* ---------- 顶栏 ---------- */
  .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .brand { font-size: 15px; font-weight: 800; color: #FF6FAE; letter-spacing: 1px; margin-right: auto; white-space: nowrap; }
  .subj-sel {
    font-family: inherit; font-size: 13px; font-weight: 700; color: #4A3E5C;
    padding: 7px 8px; border-radius: 10px; border: 2px solid #EFE4F6; background: #fff;
    appearance: none; -webkit-appearance: none; max-width: 150px;
    background-image: linear-gradient(45deg, transparent 50%, #A794B8 50%), linear-gradient(135deg, #A794B8 50%, transparent 50%);
    background-position: calc(100% - 14px) 55%, calc(100% - 9px) 55%;
    background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
  }
  .tool {
    padding: 7px 10px; border-radius: 10px; background: #fff; border: 2px solid #EFE4F6;
    font-size: 12.5px; font-weight: 700; color: #5B4B6E; cursor: pointer; user-select: none; white-space: nowrap;
  }
  .tool.warn { color: #E5487F; border-color: #F8C6DA; }
  .tool.acc  { color: #FF6FAE; border-color: #FFC6E2; }

  /* ---------- 模式页签 ---------- */
  .tabs { display: flex; gap: 6px; margin-top: 9px; }
  .tab {
    flex: 1; text-align: center; padding: 8px 2px; border-radius: 12px; background: rgba(255,255,255,.6);
    font-size: 13.5px; font-weight: 800; color: #5B4B6E; border: 2px solid transparent; cursor: pointer; user-select: none;
  }
  .tab.on { background: #fff; border-color: #FF85BD; color: #FF6FAE; box-shadow: 0 3px 8px rgba(255,138,61,.22); }
  .subtabs { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12px; color: #8A7A9C; font-weight: 700; }
  .subtabs span { padding: 5px 12px; border-radius: 999px; background: rgba(255,255,255,.7); cursor: pointer; user-select: none; }
  .subtabs span.on { background: #63C7F5; color: #fff; }
  .banner { margin-top: 9px; text-align: center; font-size: 13.5px; font-weight: 800; color: #FF6FAE; }
  #timer {
    display: none; margin: 8px auto 0; width: 132px; padding: 6px 0; border-radius: 999px;
    background: #fff; border: 2px solid #EFE4F6; text-align: center; font-size: 16px; color: #4A3E5C;
  }
  #timer.on { display: block; }
  #timer.urgent { border-color: #E5487F; color: #E5487F; animation: pulse .8s infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }

  /* ---------- 赛道 ---------- */
  .track { position: relative; margin-top: 12px; background: rgba(255,255,255,.75); border-radius: 18px; padding: 12px 12px 8px; box-shadow: 0 6px 18px rgba(40,70,110,.10); }
  .lane { position: relative; height: 56px; border-radius: 12px; background: #FFF0F7; margin-bottom: 8px; overflow: hidden; }
  .lane::after { content: ""; position: absolute; inset: 0; background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.45) 0 3px, transparent 3px 56px); }
  .lane-tag { position: absolute; left: 6px; top: 6px; font-size: 10px; font-weight: 800; line-height: 1.25; opacity: .9; }
  .runner { position: absolute; left: 0; bottom: -2px; width: 52px; height: 62px; transition: left .45s ease; }
  .runner svg { width: 100%; height: 100%; }
  .runner.run { animation: bob .45s 2; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .finish { position: absolute; top: 0; bottom: 8px; width: 6px; background: repeating-linear-gradient(45deg,#FF7B9B 0 6px,#fff 6px 12px); border-radius: 3px; }
  .finish::after { content: '🏁'; position: absolute; top: -18px; left: -8px; font-size: 14px; }
  .plus {
    position: absolute; font-size: 16px; font-weight: 900; color: #22B573;
    animation: floatUp 1s ease-out forwards; pointer-events: none; z-index: 5;
  }
  .plus.minus { color: #E5487F; }
  @keyframes floatUp { 0% { opacity: 0; transform: translateY(6px); } 25% { opacity: 1; } 100% { opacity: 0; transform: translateY(-26px); } }

  /* ---------- 答题区 ---------- */
  .pad-area { margin-top: 14px; }
  .g-switch { display: flex; gap: 8px; margin-bottom: 10px; }
  .g-chip {
    flex: 1; text-align: center; padding: 9px 0; border-radius: 12px; background: rgba(255,255,255,.7);
    font-size: 13.5px; font-weight: 800; color: #5B4B6E; cursor: pointer; user-select: none; border: 2px solid transparent;
  }
  .g-chip.on { background: #fff; border-color: var(--c, #FF85BD); color: var(--c, #FF6FAE); box-shadow: 0 3px 8px rgba(40,70,110,.12); }
  .g-chip small { display: block; font-size: 10px; font-weight: 700; color: #A090B2; }

  .station {
    background: #fff; border-radius: 20px; padding: 14px 14px 16px; display: none; flex-direction: column;
    box-shadow: 0 8px 20px rgba(40,70,110,.12); border: 2.5px solid #F5EAF9; transition: border-color .2s;
  }
  .station.show { display: flex; }
  .station.right { border-color: #45D6A0; }
  .station.wrong { border-color: #FF7B9B; animation: shake .38s; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
  .st-head { display: flex; align-items: center; gap: 10px; }
  .st-av { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: #FFF2F9; flex: none; }
  .st-av svg { width: 38px; height: 38px; }
  .st-name { font-size: 16px; font-weight: 800; }
  .st-sub { font-size: 11.5px; color: #A090B2; font-weight: 600; margin-top: 1px; }
  .st-score {
    margin-left: auto; min-width: 50px; height: 36px; padding: 0 10px; border-radius: 10px; display: grid; place-items: center;
    background: linear-gradient(135deg,#FFB0D4,#FF6FAE); color: #fff; font-size: 16px; font-weight: 800;
  }
  .st-score small { font-size: 11px; opacity: .85; }

  .qbox { display: flex; justify-content: center; align-items: center; margin: 8px 0 6px; min-height: 130px; }
  .qbox svg { width: 100%; max-width: 340px; height: auto; }
  .numbox { fill: #fff; stroke: #DCCFE8; stroke-width: 3; }
  .numbox.blank { stroke: #FF85BD; stroke-width: 3.5; stroke-dasharray: 8 6; fill: #FFF7FB; }
  .numbox.filled { stroke: #FF85BD; stroke-width: 3.5; fill: #FFEFF7; }
  .ntext { font-size: 34px; font-weight: 800; fill: #4A3E5C; }
  .ntext.ans { fill: #FF6FAE; }
  .ntext.q { fill: #FFA8D2; font-size: 32px; }
  .link { stroke: #CFC2DD; stroke-width: 3.5; fill: none; stroke-linecap: round; }

  /* 拼音题图（听音辨字） */
  .py-wrap { display: flex; flex-direction: column; align-items: center; gap: 9px; width: 100%; }
  .py-row { display: flex; gap: 12px; }
  .py-box {
    min-width: 86px; padding: 9px 14px; text-align: center; background: #FFF7FB;
    border: 2.5px solid #FFC2E0; border-radius: 16px; cursor: pointer; transition: .15s; user-select: none;
  }
  .py-box:hover { background: #FFEFF7; }
  .py-box b { display: block; font-size: 30px; font-weight: 800; color: #FF6FAE; line-height: 1.15; }
  .py-box span { display: block; font-size: 11px; color: #B07A9E; font-weight: 700; margin-top: 1px; }
  .py-blend {
    border: none; border-radius: 999px; background: linear-gradient(135deg,#FFB0D4,#FF6FAE);
    color: #fff; font-size: 13.5px; font-weight: 800; padding: 8px 20px; cursor: pointer; font-family: inherit;
  }

  /* 拼音-分与合 题图 */
  .pyb-wrap { display: flex; flex-direction: column; align-items: center; width: 100%; }
  .pyb-top {
    display: flex; align-items: center; gap: 12px; padding: 8px 18px;
    background: #FFF7FB; border: 2.5px solid #FFC2E0; border-radius: 16px;
    cursor: pointer; transition: .15s; user-select: none;
  }
  .pyb-top b { font-size: 25px; font-weight: 800; color: #FF6FAE; letter-spacing: 1px; }
  .pyb-top i { font-style: normal; font-size: 27px; font-weight: 800; color: #4A3E5C; }
  .pyb-top span { font-size: 11px; color: #B07A9E; font-weight: 700; }
  .qbox svg.pyb-links { width: 220px; height: 22px; max-width: none; margin: 2px 0; }
  .pyb-row { display: flex; gap: 22px; }
  .pyb-slot {
    min-width: 84px; padding: 4px 0; border-radius: 14px; text-align: center;
    background: #FFF7FB; border: 2.5px dashed #FF85BD;
  }
  .pyb-slot.filled { border-style: solid; background: #FFEFF7; }
  .pyb-slot b { display: block; font-size: 24px; font-weight: 800; color: #FF6FAE; line-height: 1.15; }
  .pyb-slot span { display: block; font-size: 11px; color: #B07A9E; font-weight: 700; }

  .pad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
  .key {
    height: 46px; border-radius: 12px; background: #FBF6FD; border: 2px solid #EFE4F6; color: #4A3E5C;
    font-size: 22px; font-weight: 800; cursor: pointer; transition: .12s; display: grid; place-items: center; user-select: none;
  }
  .key:active { transform: scale(.94); }
  .key.sel { background: linear-gradient(135deg,#FFB0D4,#FF6FAE); border-color: #FF6FAE; color: #fff; box-shadow: 0 4px 10px rgba(255,107,53,.35); }
  .key.charKey { font-size: 26px; }
  .pad-cap { font-size: 11.5px; font-weight: 700; color: #A090B2; margin: 3px 0 5px 2px; }
  .pad-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; margin-bottom: 6px; }
  .acts { display: flex; gap: 8px; margin-top: 10px; }
  .btn {
    flex: 1; height: 44px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer;
    font-family: inherit; appearance: none; border: 2px solid #EFE4F6; background: #FBF6FD; color: #74648A; transition: .12s;
  }
  .btn:disabled { opacity: .45; }
  .btn.go { background: linear-gradient(135deg,#FFB0D4,#FF6FAE); border-color: #FF6FAE; color: #fff; font-weight: 800; }
  .btn.go:active { transform: scale(.97); }

  /* ---------- 弹窗 ---------- */
  .mask { position: fixed; inset: 0; background: rgba(20,32,48,.45); display: none; place-items: center; z-index: 100; padding: 18px; }
  .mask.show { display: grid; }
  .modal { background: #fff; border-radius: 22px; padding: 22px 20px; width: 100%; max-width: 420px; max-height: 84vh; overflow: auto; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
  .modal h3 { font-size: 19px; color: #FF6FAE; margin-bottom: 10px; text-align: center; }
  .modal ul { list-style: none; }
  .modal li { font-size: 14px; color: #5B4B6E; line-height: 1.7; padding: 5px 0 5px 20px; position: relative; }
  .modal li::before { content: '🏁'; position: absolute; left: 0; font-size: 12px; top: 9px; }
  .crown { font-size: 44px; text-align: center; }
  .win-txt { text-align: center; font-size: 14px; color: #9A8AAB; font-weight: 700; margin-top: 4px; }
  .win-name { text-align: center; font-size: 23px; font-weight: 900; color: #FF6FAE; margin: 5px 0 12px; }
  .rank { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .rk { background: #FCF7FE; border-radius: 10px; padding: 8px 12px; font-size: 14.5px; font-weight: 700; color: #4A3E5C; }
  .foot { display: flex; gap: 10px; margin-top: 12px; }
  .mbtn {
    flex: 1; height: 46px; border-radius: 12px; border: none; font-family: inherit; font-size: 16px; font-weight: 800;
    background: linear-gradient(135deg,#FFB0D4,#FF6FAE); color: #fff; cursor: pointer;
  }
  .mbtn.ghost { background: #FBF6FD; color: #74648A; border: 2px solid #EFE4F6; font-weight: 700; }
  .cq { display: flex; gap: 10px; }
  .cq-row { flex: 1; display: flex; flex-direction: column; gap: 5px; }
  .cq-row label { font-size: 12.5px; font-weight: 800; color: #5B4B6E; }
  .cq-row input {
    height: 46px; border: 2px solid #EFE4F6; border-radius: 12px; text-align: center; font-size: 20px; font-weight: 800;
    font-family: inherit; color: #4A3E5C; background: #FCF7FE; outline: none; width: 100%;
  }
  .cq-row input:focus { border-color: #FF85BD; background: #fff; }
  .tip { margin-top: 12px; font-size: 13px; color: #9A8AAB; text-align: center; line-height: 1.7; }
  .tip.err { color: #E5487F; font-weight: 700; }

  /* ---------- 全屏拼音表 ---------- */
  .chart-mask { position: fixed; inset: 0; z-index: 200; display: none; overflow: auto; background: linear-gradient(180deg,#FFF6FB 0%,#F7F2FF 100%); padding: 16px 14px 60px; }
  .chart-mask.show { display: block; }
  .chart-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; max-width: 720px; margin-inline: auto; }
  .chart-head h2 { font-size: 20px; color: #FF6FAE; letter-spacing: 1px; margin-right: auto; }
  .chart-body { max-width: 720px; margin: 0 auto; }
  .chart-body h4 { margin: 16px 0 8px; font-size: 16px; color: #3D3350; }
  .c-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 8px; }
  .c-card {
    background: #fff; border-radius: 12px; padding: 10px 4px 8px; text-align: center; cursor: pointer;
    box-shadow: 0 2px 6px rgba(40,70,110,.10); border: 2px solid #F3E4F0; transition: .15s; user-select: none;
  }
  .c-card:active { transform: scale(.94); border-color: #FFA8D2; }
  .c-card b { display: block; font-size: 21px; font-weight: 800; color: #FF6FAE; line-height: 1.2; }
  .c-card span { display: block; font-size: 11px; color: #9A8AAB; margin-top: 2px; font-weight: 600; }
  .c-card.tone b { font-size: 26px; }
  .c-card.zi b { font-size: 27px; color: #3D3350; }
  .c-card.zi span { color: #FF85BD; }

  /* ---------- 自定义头像 ---------- */
  .st-av { position: relative; cursor: pointer; }
  .st-av img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; display: block; }
  .av-btn {
    position: absolute; right: -4px; bottom: -4px; width: 18px; height: 18px; border-radius: 50%;
    background: #fff; border: 2px solid #FFC6E2; display: grid; place-items: center;
    font-size: 8px; line-height: 1; pointer-events: none; box-shadow: 0 2px 5px rgba(150,80,130,.25);
  }
  .av-clear {
    position: absolute; right: -4px; top: -4px; width: 16px; height: 16px; border-radius: 50%;
    background: #FF6B8B; color: #fff; font-size: 10px; font-weight: 800; line-height: 1;
    display: none; place-items: center; border: 2px solid #fff; z-index: 3;
  }
  .st-av.has-av .av-clear { display: grid; }
  .runner img {
    position: absolute; left: 50%; bottom: 2px; transform: translateX(-50%);
    width: 46px; height: 46px; border-radius: 50%; object-fit: cover; border: 3px solid #fff;
    box-shadow: 0 3px 8px rgba(90,60,110,.22);
  }
  .runner .rbadge {
    position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
    min-width: 18px; height: 18px; padding: 0 3px; border-radius: 999px; color: #fff;
    font-size: 10px; font-weight: 800; display: grid; place-items: center; border: 2px solid #fff;
  }
</style>
</head>
<body>
<div class="app">

  <div class="top">
    <div class="brand">🏃 田径大赛 H5</div>
    <select class="subj-sel" id="subjectSel">
      <option value="math">数学 · 分与合</option>
      <option value="pinyin">拼音 · 点读练习</option>
      <option value="pinyin-blend">拼音 · 分与合</option>
    </select>
    <div class="tool acc" id="btnChart" style="display:none">📖 拼音表</div>
    <div class="tool" id="btnSound">🔊</div>
    <div class="tool" id="btnRule">❓</div>
    <div class="tool warn" id="btnReset">↻ 重赛</div>
  </div>

  <div class="subtabs" id="diff">
    范围
    <span data-max="5">5以内</span>
    <span data-max="10" class="on">10以内</span>
  </div>

  <div class="tabs" id="tabs">
    <div class="tab on" data-mode="practice">练习</div>
    <div class="tab" data-mode="challenge">挑战</div>
    <div class="tab" data-mode="pyblend" style="display:none">拼音-分与合</div>
    <div class="tab" data-mode="custom">自定义</div>
  </div>

  <div class="banner" id="banner">🏃 答对一题 · 前进一格 🏁</div>
  <div id="timer"><b>02:00</b></div>

  <div class="track">
    <div id="lanes" style="position:relative"></div>
    <div class="finish" id="finishLine"></div>
  </div>

  <div class="pad-area">
    <div class="g-switch" id="gSwitch"></div>
    <div id="stations"></div>
  </div>
</div>

<!-- 规则 -->
<div class="mask" id="maskRule">
  <div class="modal">
    <h3>游戏规则</h3>
    <ul id="ruleList"></ul>
    <div class="foot"><button class="mbtn" id="closeRule">知道了</button></div>
  </div>
</div>

<!-- 自定义出题 -->
<div class="mask" id="maskCustom">
  <div class="modal">
    <h3>自定义出题</h3>
    <div class="cq">
      <div class="cq-row"><label>总 数</label><input id="cqTop" type="number" inputmode="numeric" min="0" max="10" placeholder="留空=要填"></div>
      <div class="cq-row"><label>部分 ①</label><input id="cqA" type="number" inputmode="numeric" min="0" max="10" placeholder="留空=要填"></div>
      <div class="cq-row"><label>部分 ②</label><input id="cqB" type="number" inputmode="numeric" min="0" max="10" placeholder="留空=要填"></div>
    </div>
    <p class="tip" id="cqTip">把要学生填的那一格<b>留空</b>，其余两格填数。例：总数 8、部分① 3、部分② 留空 → 答案是 5。</p>
    <div class="foot">
      <button class="mbtn ghost" id="cqCancel">取消</button>
      <button class="mbtn" id="cqApply">应用出题</button>
    </div>
  </div>
</div>

<!-- 结算 -->
<div class="mask" id="maskWin">
  <div class="modal">
    <div class="crown">🏆</div>
    <div class="win-txt">冠军小组</div>
    <div class="win-name" id="winName"></div>
    <div class="rank" id="rankList"></div>
    <div class="foot">
      <button class="mbtn ghost" id="closeWin">继续观战</button>
      <button class="mbtn" id="againWin">再来一局</button>
    </div>
  </div>
</div>

<!-- 全屏拼音表 -->
<div class="chart-mask" id="chartMask">
  <div class="chart-head">
    <h2>🔤 拼音点读表</h2>
    <div class="tool acc" id="chartFs">⛶ 全屏</div>
    <div class="tool warn" id="chartClose">✕ 关闭</div>
  </div>
  <div class="chart-body" id="chartBody"></div>
</div>

<script>
/* ---------------- 角色 ---------------- */
const ANIMALS = [
  { key:'kuromi', name:'库洛米', color:'#A98BFF', c1:'#E3D7FF', c2:'#CBB4FF' },
  { key:'egg',    name:'蛋仔',   color:'#F5A623', c1:'#FFEDB8', c2:'#FFD770' },
  { key:'elsa',   name:'爱莎',   color:'#4FB8EE', c1:'#D5EEFF', c2:'#A9DBFF' },
  { key:'egg2',   name:'粉蛋仔', color:'#FF7EB6', c1:'#FFDBEC', c2:'#FFB3D6' }
];
/* 卡通简化版角色：库洛米 / 蛋仔 / 爱莎公主 / 粉色蛋仔 */
function animalSVG(kind, n, color) {
  const badge = `<circle cx="50" cy="95" r="13" fill="${color}" stroke="#fff" stroke-width="2.5"/>
                 <text x="50" y="100" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">${n}</text>`;
  const base  = `<ellipse cx="50" cy="115" rx="30" ry="6" fill="rgba(70,45,90,.16)"/>`;

  if (kind === 'kuromi') {
    return `<svg viewBox="0 0 100 120">
      ${base}
      <path d="M26 110 C26 82 74 82 74 110 Z" fill="#3A3346"/>
      <ellipse cx="50" cy="85" rx="15" ry="6" fill="#FFF6FA"/>
      <path d="M32 54 C20 42 14 21 22 10 C35 15 45 33 46 52 Z" fill="#3A3346"/>
      <path d="M68 54 C80 42 86 21 78 10 C65 15 55 33 54 52 Z" fill="#3A3346"/>
      <circle cx="50" cy="58" r="30" fill="#3A3346"/>
      <circle cx="50" cy="61" r="23" fill="#FFF6FA"/>
      <circle cx="50" cy="30" r="9" fill="#FFD1E6"/>

let zhVoice = null;
function pickVoice() {
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  zhVoice = vs.find(v => /zh[-_]CN/i.test(v.lang)) || vs.find(v => /zh/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, rate) {
  if (!('speechSynthesis' in window) || !text) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text));
    u.lang = 'zh-CN';
    if (zhVoice) u.voice = zhVoice;
    u.rate = rate || 0.75;
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* ---------------- 出题 ---------------- */
function newQuestion() {
  if (SUBJECT === 'pinyin') return MODE === 'pyblend' ? newPinyinBlendQuestion() : newPinyinQuestion();
  const flip = Math.random() < 0.5;
  if (Math.random() < 0.5) {
    const t = rnd(2, MAXN);
    const a = rnd(1, t - 1);
    const b = t - a;
    const blankSecond = Math.random() < 0.5;
    return { top: t, parts: blankSecond ? [a, null] : [null, b], answer: blankSecond ? b : a, flip };
  }
  const a = rnd(1, MAXN - 1);
  const b = rnd(1, MAXN - a);
  return { top: null, parts: [a, b], answer: a + b, flip };
}
function newPinyinQuestion() {
  const t = CHARS[rnd(0, CHARS.length - 1)];
  const pool = CHARS.filter(x => x.c !== t.c && x.p !== t.p);
  const opts = [t.c];
  while (opts.length < 4) {
    const d = pool[rnd(0, pool.length - 1)].c;
    if (!opts.includes(d)) opts.push(d);
  }
  for (let i = opts.length - 1; i > 0; i--) { const j = rnd(0, i); [opts[i], opts[j]] = [opts[j], opts[i]]; }
  return { kind: 'py', top: null, parts: [null, null], flip: false,
           char: t.c, pinyin: t.p, sm: t.sm, ym: t.ym, tone: t.t, opts, answer: t.c };
}
function newPinyinBlendQuestion() {
  const t = CHARS[rnd(0, CHARS.length - 1)];
  const smPool = SM_LIST.map(([s]) => s).filter(s => s !== t.sm);
  const ymPool = Object.keys(YM_SAY).filter(y => y !== t.ym);
  const pick3 = arr => { const out = []; while (out.length < 3) { const v = arr[rnd(0, arr.length - 1)]; if (!out.includes(v)) out.push(v); } return out; };
  const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = rnd(0, i); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
  return { kind: 'pyblend', top: null, parts: [null, null], flip: false,
           char: t.c, pinyin: t.p, sm: t.sm, ym: t.ym, tone: t.t,
           smOpts: shuffle([t.sm, ...pick3(smPool)]),
           ymOpts: shuffle([t.ym, ...pick3(ymPool)]),
           answer: t.c };
}
function questionKey(q) {
  if (q.kind === 'py') return `py|${q.char}`;
  if (q.kind === 'pyblend') return `pyb|${q.char}`;
  return `${q.top}|${q.parts[0]}|${q.parts[1]}|${q.flip ? 1 : 0}`;
}
const usedQKeys = new Set();
function uniqueQuestion() {
  let fallback = null;
  for (let i = 0; i < 80; i++) {
    const q = newQuestion();
    const key = questionKey(q);
    if (!fallback) fallback = q;
    if (!usedQKeys.has(key)) { usedQKeys.add(key); return q; }
  }
  if (fallback) { usedQKeys.clear(); usedQKeys.add(questionKey(fallback)); }
  return fallback;
}

const AV_KEY = 'trackrace.avatar.v1.';
let pendingAv = null;
const avInput = document.createElement('input');
avInput.type = 'file';
avInput.accept = 'image/*';
avInput.style.display = 'none';
document.body.appendChild(avInput);
avInput.onchange = () => {
  const f = avInput.files && avInput.files[0];

  const g = pendingAv; pendingAv = null;
  const fr = new FileReader();
  fr.onload = () => {
    const im = new Image();
    im.onload = () => {
      const S = 200, c = document.createElement('canvas');
      c.width = c.height = S;
      const ctx = c.getContext('2d');
      const side = Math.min(im.width, im.height);
      ctx.drawImage(im, (im.width - side) / 2, (im.height - side) / 2, side, side, 0, 0, S, S);
      setAvatar(g, c.toDataURL('image/jpeg', 0.9));
    };
    im.onerror = () => alert('这张图片打不开，换一张试试～');
    im.src = fr.result;
  };
  fr.readAsDataURL(f);
};

function pinyinDiagram(q, pick) {
  return `<div class="py-wrap">
    <div class="py-row">
      <div class="py-box" data-say="${SM_SAY[q.sm] || q.sm}"><b>${q.sm}</b><span>声母 · 点击听</span></div>
      <div class="py-box" data-say="${YM_SAY[q.ym] || q.ym}"><b>${q.ym}</b><span>韵母 · 点击听</span></div>
      <div class="py-box" data-say="${TONE_NAME[q.tone]}"><b>${TONE_MARK[q.tone]}</b><span>${TONE_NAME[q.tone]}</span></div>
    </div>
    <button type="button" class="py-blend" data-say="${q.char}">🔊 拼一拼 · 听整字</button>
    ${pick !== null ? `<div style="font-size:12px;color:#A090B2;font-weight:700">已选：<b style="color:#FF6FAE">${pick}</b></div>` : ''}
  </div>`;
}
function pinyinBlendDiagram(q, pickSm, pickYm) {
  const slot = (val, filled, label) =>
    `<div class="pyb-slot${filled ? ' filled' : ''}"><b>${val || '?'}</b><span>${label}</span></div>`;
  return `<div class="pyb-wrap">
    <div class="pyb-top" data-say="${q.char}">
      <b>${q.pinyin}</b><i>${q.char}</i><span>🔊 点击听</span>
    </div>
    <svg class="pyb-links" viewBox="0 0 260 24" preserveAspectRatio="none">
      <path class="link" d="M130 0 L86 24"/><path class="link" d="M130 0 L174 24"/>
    </svg>
    <div class="pyb-row">
      ${slot(pickSm, !!pickSm, '声母')}
      ${slot(pickYm, !!pickYm, '韵母')}
    </div>
  </div>`;
}
function diagram(q, pick, pickSm, pickYm) {
  if (q.kind === 'pyblend') return pinyinBlendDiagram(q, pickSm, pickYm);
  if (q.kind === 'py') return pinyinDiagram(q, pick);
  const box = (x, y, val, isBlank) => {
    const cls = isBlank ? (pick !== null ? 'numbox filled' : 'numbox blank') : 'numbox';
    const txt = isBlank
      ? (pick !== null ? `<text class="ntext ans" x="${x + 40}" y="${y + 38}" text-anchor="middle">${pick}</text>`
                       : `<text class="ntext q" x="${x + 40}" y="${y + 38}" text-anchor="middle">?</text>`)
      : `<text class="ntext" x="${x + 40}" y="${y + 38}" text-anchor="middle">${val}</text>`;
    return `<rect class="${cls}" x="${x}" y="${y}" width="80" height="52" rx="14"/>${txt}`;
  };
  const links = q.flip
    ? `<path class="link" d="M80 64 L150 108" /><path class="link" d="M220 64 L150 108" />`
    : `<path class="link" d="M150 66 L80 108" /><path class="link" d="M150 66 L220 108" />`;
  const topRow  = q.flip
    ? box(40, 12, q.parts[0], q.parts[0] === null) + box(180, 12, q.parts[1], q.parts[1] === null)
    : box(110, 12, q.top, q.top === null);
  const botRow  = q.flip
    ? box(110, 108, q.top, q.top === null)
    : box(40, 108, q.parts[0], q.parts[0] === null) + box(180, 108, q.parts[1], q.parts[1] === null);
  const label = q.flip ? '分 ⟶ 合' : '合 ⟶ 分';
  return `<svg viewBox="0 0 300 176">${links}${topRow}${botRow}
    <text x="150" y="170" text-anchor="middle" font-size="14" fill="#B4A6C4" font-weight="600">${label}</text></svg>`;
}

      k.onclick = () => {
        if (g.done || g.lock || finished) return;
        if (k.dataset.slot === 'sm') g.pickSm = k.dataset.val;
        else g.pickYm = k.dataset.val;
        speak(sayOf(k.dataset.slot, k.dataset.val));
        render(g);
      };
    });
    return;
  }
  g.padEl.style.display = 'grid';
  if (g.q.kind === 'py') {
    g.padEl.style.gridTemplateColumns = 'repeat(4, 1fr)';
    g.q.opts.forEach(ch => {
      const k = document.createElement('div');
      k.className = 'key charKey' + (g.pick === ch ? ' sel' : '');
      k.textContent = ch;
      k.onclick = () => { if (g.done || g.lock || finished) return; g.pick = ch; render(g); };
      g.padEl.appendChild(k);
    });
    return;
  }
  g.padEl.style.gridTemplateColumns = 'repeat(5, 1fr)';
  for (let n = 1; n <= MAXN; n++) {
    const k = document.createElement('div');
    k.className = 'key' + (g.pick === n ? ' sel' : '');
    k.textContent = n;
    k.onclick = () => { if (g.done || g.lock || finished) return; g.pick = n; render(g); };
    g.padEl.appendChild(k);
  }
}
function render(g) {
  g.qEl.innerHTML = diagram(g.q, g.pick, g.pickSm, g.pickYm);
  renderPad(g);
  g.okEl.disabled = g.q.kind === 'pyblend' ? !(g.pickSm && g.pickYm) : g.pick === null;
}
function resetGroup(g) {
  g.lock = false;
  g.pickSm = null; g.pickYm = null;
  g.q = (MODE === 'custom' && customQ)
    ? { top: customQ.top, parts: [customQ.parts[0], customQ.parts[1]], answer: customQ.answer, flip: Math.random() < 0.5 }
    : uniqueQuestion();
  g.pick = null; render(g);
}

/* ---------------- 提交判定 ---------------- */
let finished = false;
function submit(g) {
  if (g.done || g.lock || finished) return;
  if (g.q.kind === 'pyblend') { if (!g.pickSm || !g.pickYm) return; }
  else if (g.pick === null) return;
  g.lock = true;
  g.okEl.disabled = true;
  const ok = g.q.kind === 'pyblend'
    ? (g.pickSm === g.q.sm && g.pickYm === g.q.ym)
    : (g.pick === g.q.answer);
  if (ok) {
    beep(true);
    if (g.q.kind === 'py' || g.q.kind === 'pyblend') speak(g.q.char);
    g.el.classList.add('right');
    g.progress = Math.min(STEPS, g.progress + 1);
    g.scEl.innerHTML = `${g.progress}<small>/10</small>`;
    g.chipEl.querySelector('small').textContent = `${g.progress}/10`;
    placeRunner(g, true);
    const p = document.createElement('div');
    p.className = 'plus'; p.textContent = '+1';
    p.style.left = (START + g.progress * stepPx + 14) + 'px';
    p.style.top = (g.laneEl.offsetTop + 8) + 'px';
    lanesEl.appendChild(p);
    setTimeout(() => p.remove(), 1100);
    const timer = setTimeout(() => { g.el.classList.remove('right'); resetGroup(g); }, 700);
    qTimers.set(g, timer);
    if (g.progress >= STEPS) { g.done = true; setTimeout(() => win(g), 900); }
  } else {
    beep(false);
    g.el.classList.add('wrong');
    if (MODE === 'challenge' && g.progress > 0) {
      g.progress -= 1;
      g.scEl.innerHTML = `${g.progress}<small>/10</small>`;
      g.chipEl.querySelector('small').textContent = `${g.progress}/10`;
      placeRunner(g, false);
      const m = document.createElement('div');
      m.className = 'plus minus'; m.textContent = '-1';
      m.style.left = (START + g.progress * stepPx + 14) + 'px';
      m.style.top = (g.laneEl.offsetTop + 8) + 'px';
      lanesEl.appendChild(m);
      setTimeout(() => m.remove(), 1100);
    }
    const timer = setTimeout(() => {
      g.el.classList.remove('wrong');
      g.lock = false;                                   // 答错后解锁，否则这组再也答不了题
      g.pick = null; g.pickSm = null; g.pickYm = null; render(g);
    }, 620);
    qTimers.set(g, timer);
  }
}

/* ---------------- 结算 ---------------- */
function win(g, reason) {
  if (finished) return; finished = true;
  stopTimer();
  GROUPS.forEach(group => { if (qTimers.has(group)) clearTimeout(qTimers.get(group)); });
  document.querySelector('#maskWin .win-txt').textContent =
    reason === 'tie' ? '时间到 · 平局' : reason === 'time' ? '时间到 · 领先小组' : '冠军小组';
  document.getElementById('winName').textContent =
    g ? `${g.no}号 ${g.name}组` : reason === 'tie' ? '多个小组并列领先' : '无人冲线';
  const rank = [...GROUPS].sort((a, b) => b.progress - a.progress);
  document.getElementById('rankList').innerHTML =
    rank.map((x, i) => `<div class="rk">${['🥇','🥈','🥉','4️⃣'][i]} ${x.no}号${x.name} · ${x.progress}/10</div>`).join('');
  document.getElementById('maskWin').classList.add('show');
}

/* ---------------- 模式 ---------------- */
const bannerEl = document.getElementById('banner');
document.querySelectorAll('#tabs .tab').forEach(t => {
  t.onclick = () => setMode(t.dataset.mode);
});
function bannerFor(m) {
  if (SUBJECT === 'pinyin') {
    if (m === 'pyblend')  return '🧩 拼音-分与合 · 听音选拼 🏁';
    return m === 'challenge' ? '⏱ 限时听音辨字 · 答错退一格 🏁' : '🔊 听音辨字 · 前进一格 🏁';
  }
  if (m === 'challenge') return '⏱ 限时挑战 · 答错退一格 🏁';
  if (m === 'custom')    return '✏️ 自定义出题 · 教师定题 🏁';
  return '🏃 答对一题 · 前进一格 🏁';
}
function setMode(m) {
  MODE = m;
  if (m !== 'custom') customQ = null;
  bannerEl.innerHTML = bannerFor(m);
  if (typeof syncSubjSel === 'function') syncSubjSel();
  resetAll();
  if (m === 'custom') openCustom();
}
function syncTabs() {
  document.querySelectorAll('#tabs .tab').forEach(x => x.classList.toggle('on', x.dataset.mode === MODE));
}

/* ---------------- 计时器 ---------------- */
const timerEl = document.getElementById('timer');
let timerId = null, timeLeft = 0;
const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
function startTimer(sec) {
  stopTimer();
  timeLeft = sec; timerEl.classList.add('on'); updateTimer();
  timerId = setInterval(() => { timeLeft--; updateTimer(); if (timeLeft <= 0) endByTime(); }, 1000);
}
function updateTimer() {
  timerEl.querySelector('b').textContent = fmt(Math.max(0, timeLeft));
  timerEl.classList.toggle('urgent', timeLeft <= 15);
}
function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } timerEl.classList.remove('on', 'urgent'); }
function endByTime() {
  stopTimer();
  const rank = [...GROUPS].sort((a, b) => b.progress - a.progress);
  const tied = rank[0].progress > 0 && rank[1] && rank[1].progress === rank[0].progress;
  win(tied ? null : rank[0].progress > 0 ? rank[0] : null, tied ? 'tie' : 'time');
}

/* ---------------- 自定义出题 ---------------- */
const maskCustom = document.getElementById('maskCustom');
const TIP_DEFAULT = '把要学生填的那一格<b>留空</b>，其余两格填数。例：总数 8、部分① 3、部分② 留空 → 答案是 5。';
function openCustom() { maskCustom.classList.add('show'); }
document.getElementById('cqCancel').onclick = () => {
  maskCustom.classList.remove('show');
  if (!customQ) { MODE = 'practice'; bannerEl.innerHTML = bannerFor('practice'); resetAll(); }
  syncTabs();
};
document.getElementById('cqApply').onclick = () => {
  const val = id => { const s = document.getElementById(id).value.trim(); return s === '' ? null : parseInt(s, 10); };
  const top = val('cqTop'), a = val('cqA'), b = val('cqB');
  const tip = document.getElementById('cqTip');
  const err = msg => { tip.textContent = msg; tip.className = 'tip err'; };
  if ([top, a, b].filter(x => x === null).length !== 1) return err('请只留空一格（学生要填的那格），另外两格填数。');
  if ([top, a, b].some(x => x !== null && (isNaN(x) || x < 0 || x > 10))) return err('数字只能在 0 – 10 之间。');
  if ([top, a, b].some(x => x !== null && x > MAXN)) return err(`当前范围是 ${MAXN} 以内，已填数字不能超过 ${MAXN}。`);
  let q = null;
  if (top === null) {
    if (a + b > 10 || a + b < 1) return err('两个部分数之和要 ≥ 1 且 ≤ 10。');
    q = { top: null, parts: [a, b], answer: a + b };
  } else if (a === null) {
    if (b >= top) return err('部分数必须小于总数 ' + top + '。');
    q = { top, parts: [null, b], answer: top - b };
  } else {
    if (a >= top) return err('部分数必须小于总数 ' + top + '。');
    q = { top, parts: [a, null], answer: top - a };
  }
  if (q.answer > MAXN) return err(`答案是 ${q.answer}，超过当前 ${MAXN} 以内范围。`);
  customQ = q;
  tip.innerHTML = TIP_DEFAULT; tip.className = 'tip';
  maskCustom.classList.remove('show');
  finished = false;
  GROUPS.forEach(g => { g.done = false; resetGroup(g); });
};

/* ---------------- 控制 ---------------- */
document.getElementById('btnRule').onclick = () => {
  const modeText = MODE === 'challenge' ? '挑战模式' : MODE === 'custom' ? '自定义出题' : '练习模式';
  const rules = SUBJECT === 'pinyin' ? [
    `当前为${modeText} · 拼音练习，4 个小组轮流在同一台手机/平板上答题。`,
    MODE === 'pyblend'
      ? '「拼音-分与合」：上方显示完整拼音（带声调）和汉字，点击可听读音；在下方选出正确的 声母 和 韵母。'
      : '题目给出 声母 + 韵母 + 声调，在下方 4 个汉字中选出对应的字。',
    '声母、韵母、声调卡片和选项都能点击听发音，「拼一拼」可听整字读音。',
    '答对 → 小动物前进一格并读出该字；先前进 10 格的小组获胜。',
    MODE === 'challenge' ? '挑战模式限时 2 分钟，答错后退一格。' : '练习模式答错不后退，可继续尝试。',
    '点击顶栏「📖 拼音表」可全屏打开声母、韵母、四声、常用字点读表。',
    '通过答题区上方的彩色小组按钮切换不同小组的答题台。'
  ] : [
    `当前为${modeText} · 数学分与合，范围是 ${MAXN} 以内；自动题在一局内不重复。`,
    '4 个小组轮流答题：用答题区上方的彩色按钮切换小组。',
    '答对 → 该组小动物前进一格；前进 10 格抵达终点。',
    MODE === 'challenge' ? '挑战模式限时 2 分钟，答错后退一格。' : '练习模式答错不后退，可继续尝试。',
    MODE === 'custom' ? '自定义模式使用教师设置的同一道题，应用后不重置比分。' : '题目包含「知总数求部分」和「知部分求总数」。',
    '每次刷新题目会随机出现两种版式：「上合下分」（总数在上）和「上分下合」（部分数在上）。'
  ];
  document.getElementById('ruleList').innerHTML = rules.map(rule => `<li>${rule}</li>`).join('');
  document.getElementById('maskRule').classList.add('show');
};
document.getElementById('closeRule').onclick = () => document.getElementById('maskRule').classList.remove('show');
document.getElementById('closeWin').onclick = () => document.getElementById('maskWin').classList.remove('show');
document.getElementById('againWin').onclick = () => { document.getElementById('maskWin').classList.remove('show'); resetAll(); };
document.getElementById('btnReset').onclick = () => resetAll();
document.querySelectorAll('#diff span').forEach(s => {
  s.onclick = () => {
    document.querySelectorAll('#diff span').forEach(x => x.classList.remove('on'));
    s.classList.add('on'); MAXN = +s.dataset.max;
    if (MODE === 'custom') customQ = null;
    resetAll();
    if (MODE === 'custom') openCustom();
  };
});
function resetAll() {
  finished = false;
  usedQKeys.clear();
  layoutTrack();
  GROUPS.forEach(g => {
    if (qTimers.has(g)) clearTimeout(qTimers.get(g));
    g.progress = 0; g.done = false; g.lock = false;
    g.scEl.innerHTML = `0<small>/10</small>`;
    g.chipEl.querySelector('small').textContent = '0/10';
    placeRunner(g, false);
    resetGroup(g);
  });
  syncStations();
  if (MODE === 'challenge') startTimer(CHALLENGE_SEC); else stopTimer();
}

/* ---------------- 音效 ---------------- */
let sndOn = true, ac = null;
document.getElementById('btnSound').onclick = e => {
  sndOn = !sndOn; e.currentTarget.textContent = sndOn ? '🔊' : '🔇';
};
function beep(ok) {
  if (!sndOn) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const notes = ok ? [660, 880] : [220, 165];
    notes.forEach((f, i) => {
      const o = ac.createOscillator(), gn = ac.createGain();
      o.type = ok ? 'triangle' : 'sawtooth';
      o.frequency.value = f;
      gn.gain.setValueAtTime(0.0001, ac.currentTime + i * 0.12);
      gn.gain.exponentialRampToValueAtTime(0.18, ac.currentTime + i * 0.12 + 0.02);
      gn.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + i * 0.12 + 0.16);
      o.connect(gn).connect(ac.destination);
      o.start(ac.currentTime + i * 0.12); o.stop(ac.currentTime + i * 0.12 + 0.2);
    });
  } catch (e) {}
}

/* ---------------- 学习分类 + 拼音表 ---------------- */
const maskChart = document.getElementById('chartMask');
function buildChart() {
  const card = (big, small, say, cls) =>
    `<div class="c-card ${cls || ''}" data-say="${say}"><b>${big}</b><span>${small}</span></div>`;
  let html = '<h4>声母（23 个 · 点击听呼读音）</h4><div class="c-grid">'
    + SM_LIST.map(([s, c]) => card(s, c, c)).join('') + '</div>';
  YM_GROUPS.forEach(([name, arr]) => {
    html += `<h4>${name}</h4><div class="c-grid">`
      + arr.map(([y, c]) => card(y, c, c)).join('') + '</div>';
  });
  html += '<h4>四声练习（m + a · 点击听读音）</h4><div class="c-grid">'
    + [['妈','mā · 第一声'],['麻','má · 第二声'],['马','mǎ · 第三声'],['骂','mà · 第四声']]
        .map(([c, d]) => card(c, d, c, 'tone')).join('') + '</div>';
  html += '<h4>常用字点读表（一年级）</h4><div class="c-grid">'
    + CHARS.map(x => card(x.c, x.p, x.c, 'zi')).join('') + '</div>';
  document.getElementById('chartBody').innerHTML = html;
}
buildChart();
document.getElementById('btnChart').onclick = () => maskChart.classList.add('show');
document.getElementById('chartClose').onclick = () => maskChart.classList.remove('show');
document.getElementById('chartFs').onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
};
maskChart.addEventListener('click', e => {
  const t = e.target.closest('[data-say]');
  if (t) speak(t.dataset.say);
});

const subjectSel = document.getElementById('subjectSel');
subjectSel.onchange = () => setSubject(subjectSel.value);
function syncSubjSel() {
  subjectSel.value = (SUBJECT === 'pinyin' && MODE === 'pyblend') ? 'pinyin-blend' : SUBJECT;
}
function setSubject(s) {
  const blend = s === 'pinyin-blend';
  if (blend) s = 'pinyin';
  SUBJECT = s;
  customQ = null;
  document.getElementById('diff').style.display = s === 'pinyin' ? 'none' : 'flex';
  document.querySelector('.tab[data-mode="custom"]').style.display = s === 'pinyin' ? 'none' : '';
  document.querySelector('.tab[data-mode="pyblend"]').style.display = s === 'pinyin' ? '' : 'none';
  document.getElementById('btnChart').style.display = s === 'pinyin' ? 'flex' : 'none';
  if (blend)                                                            MODE = 'pyblend';
  else if (s === 'pinyin' && (MODE === 'custom' || MODE === 'pyblend')) MODE = 'practice';
  else if (s === 'math' && MODE === 'pyblend')                          MODE = 'practice';
  syncTabs();
  bannerEl.innerHTML = bannerFor(MODE);
  syncSubjSel();
  resetAll();
}

/* ---------------- 启动 ---------------- */
layoutTrack();
loadAvatars();
GROUPS.forEach(paintAvatar);
GROUPS.forEach(g => placeRunner(g, false));
GROUPS.forEach(resetGroup);
syncStations();
</script>
