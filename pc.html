<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>分与合田径大赛 · 互动课堂游戏</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #2E2440; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Source Han Sans SC", sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  #stage { position: relative; }
  .board {
    width: 1920px; height: 1080px; position: absolute; top: 0; left: 0;
    transform-origin: top left; background: #FFFFFF; overflow: hidden;
    border-radius: 14px; box-shadow: 0 24px 70px rgba(0,0,0,.45);
    display: flex; flex-direction: column; user-select: none;
  }

  /* ============ 顶栏 ============ */
  .topbar {
    height: 66px; flex: none; display: flex; align-items: center; padding: 0 28px;
    background: linear-gradient(180deg, #FFFFFF 0%, #FFF7FC 100%);
    border-bottom: 2px solid #F3E7F8; position: relative; z-index: 5;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo {
    width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
    background: linear-gradient(135deg, #FFB0D4, #FF6FAE); color: #fff; font-weight: 800; font-size: 17px;
    box-shadow: 0 4px 10px rgba(255,120,50,.35);
  }
  .brand-txt { font-size: 17px; font-weight: 700; color: #3D3350; letter-spacing: .5px; }
  .tabs { display: flex; gap: 8px; margin-left: 26px; }
  .tab {
    padding: 8px 20px; border-radius: 999px; font-size: 16px; font-weight: 600; color: #8A7A9C;
    background: #F7F0FB; cursor: pointer; border: 2px solid transparent; transition: .15s;
  }
  .tab.on { background: #fff; color: #FF6FAE; border-color: #FFC6E2; box-shadow: 0 3px 8px rgba(255,107,53,.16); }
  .title {
    position: absolute; left: 50%; transform: translateX(-50%);
    font-size: 27px; font-weight: 800; letter-spacing: 3px; color: #3D3350;
    text-shadow: 0 2px 0 #FFD6EA;
  }
  .tools { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .tool {
    display: flex; align-items: center; gap: 7px; height: 38px; padding: 0 16px; border-radius: 10px;
    font-size: 15px; font-weight: 600; color: #5B4B6E; background: #F7F0FB; cursor: pointer;
    border: 1.5px solid #EFE4F6; transition: .15s;
  }
  .tool:hover { background: #F3EDFC; color: #8A6BF0; border-color: #DCCBFA; }
  .tool.warn:hover { background: #FFF0F7; color: #FF6FAE; border-color: #FFC6E2; }
  .diff { display: flex; background: #F7F0FB; border-radius: 10px; padding: 3px; border: 1.5px solid #EFE4F6; }
  .diff span { padding: 6px 13px; font-size: 14px; font-weight: 600; color: #8A7A9C; border-radius: 7px; cursor: pointer; }
  .diff span.on { background: #fff; color: #FF6FAE; box-shadow: 0 2px 6px rgba(0,0,0,.08); }

  /* ============ 赛场 ============ */
  .field {
    flex: 1; position: relative; padding: 20px 60px 8px;
    background: linear-gradient(180deg, #DFF4FF 0%, #F1F0FF 62%, #EAFBF4 100%);
    overflow: hidden;
  }
  .sun { position: absolute; top: 14px; right: 46px; width: 78px; height: 78px; border-radius: 50%;
    background: radial-gradient(circle, #FFE484 40%, #FFD04D 100%); box-shadow: 0 0 40px rgba(255,208,77,.6); }
  .cloud { position: absolute; background: #fff; border-radius: 999px; opacity: .92; }
  .c1 { width: 150px; height: 46px; top: 34px; left: 150px; }
  .c1::before { content: ""; position: absolute; width: 68px; height: 68px; background: #fff; border-radius: 50%; top: -30px; left: 26px; }
  .c2 { width: 110px; height: 36px; top: 96px; left: 420px; opacity: .75; }
  .c2::before { content: ""; position: absolute; width: 52px; height: 52px; background: #fff; border-radius: 50%; top: -24px; left: 20px; }
  .banner {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; padding: 9px 26px; border-radius: 14px;
    background: linear-gradient(135deg, #FF85BD, #F0509A); color: #fff; font-size: 23px; font-weight: 800;
    letter-spacing: 2px; box-shadow: 0 8px 18px rgba(255,110,50,.35); border: 3px solid #fff;
  }

  .lanes {
    position: absolute; left: 60px; right: 60px; top: 74px; bottom: 46px;
    display: flex; flex-direction: column; gap: 9px;
  }
  .lane {
    flex: 1; min-height: 0; position: relative; border-radius: 16px; overflow: hidden;
    background: linear-gradient(180deg, #FFCBE2 0%, #FFB0D4 48%, #F58FC2 100%);
    box-shadow: inset 0 0 0 3px rgba(255,255,255,.35), 0 6px 14px rgba(180,110,50,.18);
  }
  .lane::after {
    content: ""; position: absolute; inset: 0;
    background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.45) 0 4px, transparent 4px 74px);
  }
  .lane-tag {
    position: absolute; left: -2px; top: 50%; transform: translateY(-50%); z-index: 3;
    width: 56px; height: 56px; border-radius: 13px; display: grid; place-items: center;
    background: #fff; box-shadow: 0 4px 10px rgba(0,0,0,.14); font-size: 12px; font-weight: 800; color: #5B4B6E;
    line-height: 1.1; text-align: center;
  }
  .runner {
    position: absolute; bottom: 2px; width: 96px; height: calc(100% - 4px); z-index: 4;
    transition: left .75s cubic-bezier(.34,1.3,.5,1);
  }
  .runner svg { width: 100%; height: 100%; overflow: visible; }
  .runner.run { animation: bob .32s ease 3; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-16px) rotate(-4deg); } }
  .plus {
    position: absolute; z-index: 6; font-size: 34px; font-weight: 900; color: #FFD35C;
    text-shadow: 0 3px 0 #D8508F, 0 0 14px rgba(255,210,63,.9); pointer-events: none;
    animation: floatUp 1.1s ease forwards;
  }
  @keyframes floatUp { 0% { opacity: 0; transform: translateY(6px) scale(.6); }
    25% { opacity: 1; transform: translateY(-16px) scale(1.15); }
    100% { opacity: 0; transform: translateY(-62px) scale(1); } }

  .finish {
    position: absolute; left: 1485px; top: 0; bottom: 0; width: 30px; z-index: 5;
    background-image:
      linear-gradient(45deg, #fff 25%, transparent 25%, transparent 75%, #fff 75%),
      linear-gradient(45deg, #fff 25%, transparent 25%, transparent 75%, #fff 75%);
    background-size: 15px 15px; background-position: 0 0, 15px 15px;
    background-color: #5B4B6E; border-radius: 4px; box-shadow: 0 6px 14px rgba(0,0,0,.2);
  }
  .finish-flag {
    position: absolute; left: 1485px; top: -40px; width: 30px; height: 44px; z-index: 6;
    background-image:
      linear-gradient(45deg, #3D3350 25%, transparent 25%, transparent 75%, #3D3350 75%),
      linear-gradient(45deg, #3D3350 25%, transparent 25%, transparent 75%, #3D3350 75%);
    background-size: 15px 15px; background-position: 0 0, 15px 15px; background-color: #fff;
    border-radius: 4px 4px 0 0;
  }
  .ruler { position: absolute; left: 0; right: 0; bottom: -42px; height: 42px; }
  .tick { position: absolute; top: 0; transform: translateX(-50%); text-align: center; }
  .tick i { display: block; width: 3px; height: 12px; background: #B4A6C4; border-radius: 2px; margin: 0 auto 3px; }
  .tick b { font-size: 15px; color: #8A7A9C; font-weight: 700; }
  .tick.end b { color: #FF6FAE; }

  /* ============ 答题台 ============ */
  .stations {
    flex: none; height: 470px; background: linear-gradient(180deg, #FCF7FE, #F9F2FC);
    padding: 18px 60px 26px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px;
    border-top: 3px solid #EFE4F6;
  }
  .station {
    background: #fff; border-radius: 22px; padding: 14px 16px 16px; display: flex; flex-direction: column;
    box-shadow: 0 8px 20px rgba(40,70,110,.10); border: 2.5px solid #F5EAF9; position: relative; overflow: hidden;
    transition: border-color .2s, box-shadow .2s;
  }
  .station.right { border-color: #45D6A0; box-shadow: 0 8px 22px rgba(76,209,139,.28); }
  .station.wrong { border-color: #FF7B9B; animation: shake .38s; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-9px); } 40% { transform: translateX(9px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
  .st-head { display: flex; align-items: center; gap: 10px; }
  .st-av { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; background: #FFF2F9; }
  .st-av svg { width: 40px; height: 40px; }
  .st-name { font-size: 19px; font-weight: 800; color: #3D3350; }
  .st-sub { font-size: 13px; color: #A090B2; font-weight: 600; margin-top: 1px; }
  .st-score {
    margin-left: auto; min-width: 52px; height: 40px; padding: 0 10px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center; gap: 1px; white-space: nowrap; line-height: 1;
    background: linear-gradient(135deg, #FFB0D4, #FF6FAE); color: #fff; font-size: 18px; font-weight: 800;
    box-shadow: 0 4px 10px rgba(255,107,53,.32);
  }
  .st-score small { font-size: 12px; font-weight: 600; opacity: .85; }

  .qbox { position: relative; flex: 1; display: grid; place-items: center; margin: 6px 0 4px; }
  .qbox svg { width: 100%; height: 166px; }
  .diagram-wrap { position: relative; width: 100%; display: flex; justify-content: center; }
  .numbox { fill: #fff; stroke: #DCCFE8; stroke-width: 3; }
  .numbox.blank { stroke: #FF85BD; stroke-width: 3.5; stroke-dasharray: 8 6; fill: #FFF7FB; }
  .numbox.filled { stroke: #FF85BD; stroke-width: 3.5; fill: #FFEFF7; }
  .ntext { font-size: 34px; font-weight: 800; fill: #4A3E5C; }
  .ntext.ans { fill: #FF6FAE; }
  .ntext.q { fill: #FFA8D2; font-size: 32px; }
  .link { stroke: #CFC2DD; stroke-width: 3.5; fill: none; stroke-linecap: round; }
  .flip-toggle.flip-btn {
    position: absolute; right: 0; bottom: 10px; display: inline-flex; align-items: center; gap: 9px;
    height: 52px; padding: 0 18px 0 23px; border-radius: 26px; border: 3px solid #FFD9A8;
    background: #FFF6E6; color: #C77A00; font: inherit; font-size: 25px; font-weight: 800; line-height: 1;
    cursor: pointer; box-shadow: 0 4px 10px rgba(199,122,0,.17);
  }
  .flip-toggle.flip-btn:hover { background: #FFE7C2; }
  .flip-toggle.flip-btn:active { transform: scale(.96); }
  .flip-toggle.flip-btn:disabled { opacity: .45; cursor: default; transform: none; }
  .qbox .flip-btn svg { width: 26px; height: 26px; max-width: none; flex: none; display: block; }

  .pad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .pad.compact { grid-template-columns: repeat(10, 1fr); gap: 5px; }
  .pad.compact .key { height: 40px; font-size: 19px; border-radius: 9px; }
  .key {
    height: 50px; border-radius: 12px; background: #FBF6FD; border: 2px solid #EFE4F6; color: #4A3E5C;
    font-size: 24px; font-weight: 800; cursor: pointer; transition: .12s; display: grid; place-items: center;
  }
  .key:hover { background: #FFF2F9; border-color: #FFC2E0; color: #FF6FAE; transform: translateY(-2px); }
  .key.sel { background: linear-gradient(135deg, #FFB0D4, #FF6FAE); border-color: #FF6FAE; color: #fff; box-shadow: 0 5px 12px rgba(255,107,53,.35); }
  .acts { display: flex; gap: 10px; margin-top: 12px; }
  .btn {
    flex: 1; height: 46px; border-radius: 12px; font-size: 17px; font-weight: 700; cursor: pointer;
    font-family: inherit; appearance: none; border: 2px solid #EFE4F6; background: #FBF6FD; color: #74648A; transition: .12s;
    display: flex; align-items: center; justify-content: center; line-height: 1; padding: 0;
  }
  .btn:hover { background: #F7EEFB; }
  .btn.go { border-color: #FF6FAE; background: linear-gradient(135deg, #FFB0D4, #FF6FAE); color: #fff;
    box-shadow: 0 5px 12px rgba(255,107,53,.32); }
  .btn.go:disabled { background: #F2E8F7; border-color: #EFE4F6; color: #B9ABC7; box-shadow: none; cursor: not-allowed; }
  .btn.go:not(:disabled):hover { filter: brightness(1.05); }
  .btn.help { background: #FFF8E8; border-color: #FFD59A; color: #C77A00; }
  .btn.help:hover { background: #FFF1D6; border-color: #FFC26A; }
  .btn.help:disabled { opacity: .45; cursor: not-allowed; }

  /* ============ 弹窗 ============ */
  .mask {
    position: absolute; inset: 0; background: rgba(20,32,46,.55); display: none; z-index: 30;
    align-items: center; justify-content: center; backdrop-filter: blur(3px);
  }
  .mask.show { display: flex; }
  .modal {
    width: 720px; background: #fff; border-radius: 26px; padding: 34px 40px 30px;
    box-shadow: 0 30px 70px rgba(0,0,0,.35); animation: pop .28s cubic-bezier(.3,1.4,.5,1);
  }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal h3 { font-size: 27px; color: #3D3350; margin-bottom: 18px; text-align: center; }
  .modal ul { list-style: none; }
  .modal li { font-size: 17px; color: #5B4B6E; line-height: 1.9; padding-left: 26px; position: relative; }
  .modal li::before { content: "▸"; position: absolute; left: 6px; color: #FF85BD; font-weight: 800; }
  .modal .foot { display: flex; gap: 14px; justify-content: center; margin-top: 26px; }
  .mbtn { padding: 12px 34px; border-radius: 12px; font-size: 17px; font-weight: 700; cursor: pointer; border: none;
    background: linear-gradient(135deg, #FFB0D4, #FF6FAE); color: #fff; box-shadow: 0 6px 14px rgba(255,107,53,.35); }
  .mbtn.ghost { background: #F7F0FB; color: #74648A; box-shadow: none; }
  .crown { font-size: 78px; text-align: center; margin-bottom: 6px; }
  .win-txt { text-align: center; font-size: 21px; color: #5B4B6E; margin-bottom: 4px; }
  .win-name { text-align: center; font-size: 38px; font-weight: 900; color: #FF6FAE; margin-bottom: 8px; }
  .rank { display: flex; justify-content: center; gap: 12px; margin-top: 18px; }
  .rk { padding: 10px 16px; border-radius: 12px; background: #FBF6FD; font-size: 15px; font-weight: 700; color: #6B5B7E; }
  .rk:first-child { background: linear-gradient(135deg, #FFE9A8, #FFD24D); color: #8A5B00; }

  /* 计时器 */
  .timer { display: none; align-items: center; gap: 6px; height: 38px; padding: 0 14px; border-radius: 10px;
    background: #FFF0F7; border: 1.5px solid #FFC6E2; color: #FF6FAE; font-size: 16px; font-weight: 800; }
  .timer.on { display: flex; }
  .timer b { font-size: 19px; font-variant-numeric: tabular-nums; }
  .timer.urgent { animation: pulse .55s ease-in-out infinite alternate; }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.08); } }
  .plus.minus { color: #FF7B9B; text-shadow: 0 3px 0 #C23B72, 0 0 14px rgba(255,91,91,.85); }

  /* 自定义出题 */
  .cq { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .cq-row { background: #FCF7FE; border: 2px solid #F2E7F8; border-radius: 16px; padding: 14px 10px; text-align: center; }
  .cq-row label { display: block; font-size: 15px; font-weight: 700; color: #8A7A9C; margin-bottom: 8px; }
  .cq-row input { width: 100%; height: 58px; border: 2.5px solid #E7D9F1; border-radius: 12px; text-align: center;
    font-size: 30px; font-weight: 800; color: #FF6FAE; outline: none; font-family: inherit; }
  .cq-row input:focus { border-color: #FFA8D2; background: #FFF6FB; }
  .cq-row input::placeholder { font-size: 15px; color: #CDBFD9; font-weight: 600; }
  .tip { margin-top: 16px; font-size: 15px; color: #9A8AAB; text-align: center; line-height: 1.7; }
  .tip.err { color: #FF6B8B; font-weight: 700; }

  /* ============ 分与合帮助抽屉 ============ */
  .help-mask {
    position: absolute; inset: 0; z-index: 40; background: rgba(20,32,46,.5);
    display: flex; align-items: flex-end; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .2s; backdrop-filter: blur(2px);
  }
  .help-mask.show { opacity: 1; pointer-events: auto; }
  .help-drawer {
    width: 1180px; max-height: 880px; transform: translateY(105%);
    transition: transform .3s cubic-bezier(.3,1.1,.5,1); background: #fff; border-radius: 30px 30px 0 0;
    box-shadow: 0 -24px 70px rgba(0,0,0,.35); display: flex; flex-direction: column; overflow: hidden;
  }
  .help-mask.show .help-drawer { transform: translateY(0); }
  .help-head { display: flex; align-items: center; gap: 16px; padding: 20px 34px 8px; }
  .help-title { font-size: 30px; font-weight: 900; color: #3D3350; margin-right: auto; }
  .help-close {
    width: 52px; height: 52px; border-radius: 50%; border: none; background: #F7F0FB; color: #74648A;
    font-size: 24px; font-weight: 800; cursor: pointer; display: grid; place-items: center;
  }
  .help-tip { padding: 0 34px 12px; font-size: 19px; font-weight: 700; color: #8A7A9C; text-align: center; }
  .help-body { overflow: auto; padding: 0 34px 8px; }
  /* 左：原题图；右：拖拽操作面板 */
  .help-main { display: flex; gap: 28px; align-items: stretch; }
  .help-question {
    flex: 0 0 360px; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 18px 14px; border: 3px solid #F0E0C8; border-radius: 22px;
    background: linear-gradient(180deg, #FFFDF7, #FFF5E4);
  }
  .help-question-label { font-size: 17px; font-weight: 800; color: #B49A6E; letter-spacing: 2px; margin-bottom: 8px; }
  .help-question-img { width: 100%; }
  .help-question-img svg { width: 100%; height: auto; display: block; }
  .help-question-img .flip-toggle { pointer-events: none; cursor: default; }
  .help-panel { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; }
  .help-total .help-zone { min-height: 150px; }
  .help-total.before { margin-bottom: 16px; }
  .help-total.after { margin-top: 16px; }
  .help-jars { display: flex; gap: 18px; flex: 1; }
  .help-jars .help-zone { flex: 1; min-height: 250px; }
  .help-zone {
    position: relative; border: 4px dashed #E3D5EE; border-radius: 24px; background: #FCF8FE;
    padding: 16px 18px 18px; transition: border-color .15s, background .15s;
  }
  .help-zone.drop-hover { border-color: #FF85BD; background: #FFF2F9; }
  .help-zone.solved { border-color: #45D6A0; background: #F0FFF8; }
  .help-jars .help-zone {
    border-style: solid; border-color: #E8D9B8;
    background: linear-gradient(180deg, #FFFDF5, #FFF4D8);
  }
  .help-jars .help-zone::before {
    content: ''; position: absolute; left: 12%; right: 12%; top: -11px; height: 18px;
    border-radius: 10px 10px 4px 4px; background: #CFE8D8; border: 3px solid #B7D8C5;
  }
  .help-zone-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; min-height: 44px; }
  .help-zone-head b { font-size: 46px; font-weight: 900; color: #FF6FAE; line-height: 1; }
  .help-zone-head span { font-size: 18px; font-weight: 700; color: #A090B2; white-space: nowrap; }
  .help-zone.unknown .help-zone-head b { color: #B4A6C4; }
  .help-carrots { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 9px; min-height: 76px; }
  .help-carrot { width: 58px; height: 72px; cursor: grab; touch-action: none; user-select: none; flex: none; }
  .help-carrot svg { width: 100%; height: 100%; display: block; pointer-events: none; }
  .help-carrot.dragging { opacity: .3; }
  .help-carrot-ghost {
    position: absolute; width: 66px; height: 82px; z-index: 60; pointer-events: none;
    transform: translate(-50%, -50%); filter: drop-shadow(0 6px 8px rgba(0,0,0,.28));
  }
  .help-foot { display: flex; justify-content: flex-end; gap: 16px; padding: 14px 34px 24px; border-top: 3px solid #F5EAF9; }
  .help-foot .mbtn { min-width: 190px; }

  /* 学习分类选择器 */
  .subj-sel {
    height: 38px; padding: 0 12px; border-radius: 10px; border: 1.5px solid #EFE4F6;
    background: #F7F0FB; font-size: 15px; font-weight: 700; color: #3D3350;
    font-family: inherit; outline: none; cursor: pointer;
  }
  .subj-sel:hover { background: #F3EDFC; border-color: #DCCBFA; }

  /* ============ 拼音题图 ============ */
  .py-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
  .py-row { display: flex; gap: 18px; }
  .py-box {
    width: 88px; padding: 8px 0 6px; border-radius: 14px; text-align: center;
    background: #FFF7FB; border: 2.5px dashed #FF85BD; cursor: pointer; transition: .15s; user-select: none;
  }
  .py-box:hover { background: #FFEFF7; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(255,138,61,.25); }
  .py-box b { display: block; font-size: 32px; font-weight: 800; color: #FF6FAE; line-height: 1.15; }
  .py-box span { display: block; font-size: 12px; color: #B07A9E; font-weight: 700; margin-top: 1px; }
  .py-blend {
    border: none; border-radius: 999px; background: linear-gradient(135deg, #FFB0D4, #FF6FAE);
    color: #fff; font-size: 14px; font-weight: 800; padding: 7px 20px; cursor: pointer; font-family: inherit;
  }

/* 韵母四声示范字（仅当本地录音加载失败时兜底）。

/* ---------------- 语音点读（Web Speech API） ---------------- */
let zhVoice = null;
function pickVoice() {
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  zhVoice = vs.find(v => /zh[-_]CN/i.test(v.lang)) || vs.find(v => /zh/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window) {
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function speak(text, rate) {
  if (!('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    if (zhVoice) u.voice = zhVoice;
    u.rate = rate || 0.65;               // 放慢一点，单字发音更完整
    speechSynthesis.speak(u);
  } catch (e) {}
}
/* ---------------- 拼音标准录音（本地 mp3，失败时回退到系统语音合成） ---------------- */
const YM_AUDIO_NAME = { 'ü': 'v', 'üe': 've', 'ün': 'vn' };   // 音频文件名用 v 表示 ü
let pinyinAudio = null;
let audioSeq = 0;
function playAudioFile(src, fallback) {
  const seq = ++audioSeq;
  let fellBack = false;
  const fb = () => {
    if (fellBack || seq !== audioSeq) return;   // 已被下一次点读取代，不再回退
    fellBack = true;
    speak(fallback, 0.65);
  };
  try {
    if (!pinyinAudio) pinyinAudio = new Audio();
    pinyinAudio.onerror = fb;
    pinyinAudio.pause();
    pinyinAudio.currentTime = 0;
    pinyinAudio.src = src;
    const p = pinyinAudio.play();
    if (p && p.catch) p.catch(fb);
  } catch (e) { fb(); }
}
function playPinyinSound(kind, key, fallback) {
  const name = kind === 'sm' ? key : (YM_AUDIO_NAME[key] || key);
  playAudioFile(`audio/${kind}/${name}.mp3`, fallback);
}
/* 声调卡读“韵母 + 声调”的纯韵母录音，例如 un 的第一声读 wēn，而不是“村”。
   ong 没有零声母音节，ong1/3/4 用纯韵母录音，ong2 暂用 tong2 保留正确声调。 */
function playToneSound(ym, tone, fallback) {
  const name = YM_AUDIO_NAME[ym] || ym;
  playAudioFile(`audio/tone/${name}${tone}.mp3`, fallback);
}

function newQuestion() {
  if (SUBJECT === 'pinyin') return MODE === 'pyblend' ? newPinyinBlendQuestion() : newPinyinQuestion();
  const flip = Math.random() < 0.5;           // false=上合下分(总数在上) true=上分下合(部分在上)
  if (Math.random() < 0.5) {                 // 知总数求部分
    const t = rnd(2, MAXN);
    const a = rnd(1, t - 1);
    const b = t - a;
    const blankSecond = Math.random() < 0.5;
    return { top: t, parts: blankSecond ? [a, null] : [null, b], answer: blankSecond ? b : a, flip };
  }
  const a = rnd(1, MAXN - 1);                // 知部分求总数
  const b = rnd(1, MAXN - a);
  return { top: null, parts: [a, b], answer: a + b, flip };
}
/* 拼音题：给出 声母+韵母+声调，从 4 个汉字选项中选出对应字 */
function newPinyinQuestion() {
  const t = CHARS[rnd(0, CHARS.length - 1)];
  const pool = CHARS.filter(x => x.c !== t.c && x.p !== t.p);   // 干扰项不含同音字
  const opts = [t.c];
  while (opts.length < 4) {
    const d = pool[rnd(0, pool.length - 1)].c;
    if (!opts.includes(d)) opts.push(d);
  }
  for (let i = opts.length - 1; i > 0; i--) {                  // 洗牌
    const j = rnd(0, i);
    [opts[i], opts[j]] = [opts[j], opts[i]];
  }
  return { kind: 'py', top: null, parts: [null, null], flip: false,
           char: t.c, pinyin: t.p, sm: t.sm, ym: t.ym, tone: t.t, opts, answer: t.c };
}
/* 拼音-分与合题：上面显示 完整拼音(带调)+汉字，下面让学生选出 声母 + 韵母 */
function newPinyinBlendQuestion() {
  const t = CHARS[rnd(0, CHARS.length - 1)];
  const smPool = SM_LIST.map(([s]) => s).filter(s => s !== t.sm);
  const ymPool = Object.keys(YM_SAY).filter(y => y !== t.ym);
  const pick3 = arr => {                       // 取 3 个不重复干扰项
    const out = [];
    while (out.length < 3) {
      const v = arr[rnd(0, arr.length - 1)];
      if (!out.includes(v)) out.push(v);
    }
    return out;
  };
  const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = rnd(0, i); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
  return { kind: 'pyblend', top: null, parts: [null, null], flip: false,
           char: t.c, pinyin: t.p, sm: t.sm, ym: t.ym, tone: t.t,
           smOpts: shuffle([t.sm, ...pick3(smPool)]),
           ymOpts: shuffle([t.ym, ...pick3(ymPool)]),
           toneOpts: [1, 2, 3, 4],
           answer: t.c };
}
function questionKey(q) {
  if (q.kind === 'py') return `py|${q.char}`;
  if (q.kind === 'pyblend') return `pyb|${q.char}`;
  return `${q.top}|${q.parts[0]}|${q.parts[1]}|${q.flip ? 1 : 0}`;
}
function uniqueQuestion() {
  let fallback = null;
  for (let i = 0; i < 80; i++) {
    const q = newQuestion();
    const key = questionKey(q);
    if (!fallback) fallback = q;
    if (!usedQKeys.has(key)) {
      usedQKeys.add(key);
      return q;
    }
  }
  if (fallback) {
    usedQKeys.clear();
    usedQKeys.add(questionKey(fallback));
  }
  return fallback;
}

function diagram(q, pick, pickSm, pickYm, pickTone, showPy) {
  if (q.kind === 'pyblend') return pinyinBlendDiagram(q, pickSm, pickYm, pickTone, showPy);
  if (q.kind === 'py') return pinyinDiagram(q, pick);
  const box = (x, y, val, isBlank) => {
    const cls = isBlank ? (pick !== null ? 'numbox filled' : 'numbox blank') : 'numbox';
    const txt = isBlank
      ? (pick !== null ? `<text class="ntext ans" x="${x + 40}" y="${y + 38}" text-anchor="middle">${pick}</text>`
                       : `<text class="ntext q" x="${x + 40}" y="${y + 38}" text-anchor="middle">?</text>`)
      : `<text class="ntext" x="${x + 40}" y="${y + 38}" text-anchor="middle">${val}</text>`;
    return `<rect class="${cls}" x="${x}" y="${y}" width="80" height="52" rx="14"/>${txt}`;
  };
  // q.flip = false → 上合下分（总数在上）；true → 上分下合（部分数在上）
  const links = q.flip
    ? `<path class="link" d="M80 64 L150 108" /><path class="link" d="M220 64 L150 108" />`
    : `<path class="link" d="M150 66 L80 108" /><path class="link" d="M150 66 L220 108" />`;
  const topRow  = q.flip
    ? box(40, 12, q.parts[0], q.parts[0] === null) + box(180, 12, q.parts[1], q.parts[1] === null)
    : box(110, 12, q.top, q.top === null);
  const botRow  = q.flip
    ? box(110, 108, q.top, q.top === null)
    : box(40, 108, q.parts[0], q.parts[0] === null) + box(180, 108, q.parts[1], q.parts[1] === null);
  return `<svg viewBox="0 0 300 176">
    ${links}
    ${topRow}
    ${botRow}
  </svg>`;
}

  const f = avInput.files && avInput.files[0];

    im.src = fr.result;

function loadAvatars() {
  GROUPS.forEach(g => {
    try {
      let v = localStorage.getItem(AV_KEY + g.key);
      const oldNo = OLD_AV_NO[g.key];
      if (!v && oldNo) {
        const oldV = localStorage.getItem(AV_KEY_OLD + oldNo);
        if (oldV) { v = oldV; localStorage.setItem(AV_KEY + g.key, oldV); }
      }
      if (v) g.avatar = v;
      if (oldNo) localStorage.removeItem(AV_KEY_OLD + oldNo);   // 迁移后清理旧存档
    } catch (e) {}
  });
  try { localStorage.removeItem(AV_KEY_OLD + 3); } catch (e) {}   // 已移除的 3 号爱莎
}
function saveAvatar(g) {
  try {
    if (g.avatar) localStorage.setItem(AV_KEY + g.key, g.avatar);
    else localStorage.removeItem(AV_KEY + g.key);
  } catch (e) {}
}
function setAvatar(g, url) { g.avatar = url; paintAvatar(g); saveAvatar(g); }

function renderPad(g) {
  g.padEl.innerHTML = '';
  g.padEl.classList.remove('compact');
  if (g.q.kind === 'pyblend') {                   // 拼音-分与合：选声母、韵母、声调（选项可点读）
    g.padEl.style.display = 'block';
    const cap = t => `<div class="pad-cap">${t} · 点击听音 🔊</div>`;
    const toneSay = (ym, t) => (YM_TONE_SAY[ym] && YM_TONE_SAY[ym][t - 1]) || '';
    const curYm = g.pickYm || g.q.ym;               // 声调跟着已选韵母变化，未选时用题目韵母
    const curSm = g.pickSm || g.q.sm;
    // 拼音规范：j/q/x/y 与 ü 相拼时，ü 去掉两点（jue、qu、xu、yu……），声调标在 u 上
    const toneYm = (curYm[0] === 'ü' && ['j', 'q', 'x', 'y'].includes(curSm))
      ? 'u' + curYm.slice(1) : curYm;
    const sayOf = (slot, v) => slot === 'sm' ? (SM_SAY[v] || v)
      : slot === 'ym' ? (YM_SAY[v] || v)
      : `${toneSay(curYm, +v) || TONE_NAME[v]}，${TONE_NAME[v]}`;
    const curOf = slot => slot === 'sm' ? g.pickSm : slot === 'ym' ? g.pickYm : g.pickTone;
    const grid = (arr, slot) => `<div class="pad-grid">` + arr.map(v => {
      const cur = curOf(slot);
      const label = slot === 'tone' ? `<b>${toneFinal(toneYm, +v)}</b>` : v;
      const cls = slot === 'tone' ? 'key charKey toneKey' : 'key charKey';
      return `<div class="${cls}${cur === v ? ' sel' : ''}" data-slot="${slot}" data-val="${v}">${label}</div>`;
    }).join('') + '</div>';
    g.padEl.innerHTML = `<div class="pyb-sections">
      <div class="pyb-sec">${cap('① 选声母')}${grid(g.q.smOpts, 'sm')}</div>
      <div class="pyb-sec">${cap('② 选韵母')}${grid(g.q.ymOpts, 'ym')}</div>
      <div class="pyb-sec wide">${cap('③ 选声调')}${grid(g.q.toneOpts, 'tone')}</div>
    </div>`;
    g.padEl.querySelectorAll('.key').forEach(k => {
      k.onclick = () => {
        if (g.done || g.lock || finished) return;
        if (k.dataset.slot === 'sm') g.pickSm = k.dataset.val;
        else if (k.dataset.slot === 'ym') g.pickYm = k.dataset.val;
        else g.pickTone = Number(k.dataset.val);
        if (k.dataset.slot === 'tone') playToneSound(curYm, Number(k.dataset.val), sayOf('tone', k.dataset.val));
        else playPinyinSound(k.dataset.slot, k.dataset.val, sayOf(k.dataset.slot, k.dataset.val));
        render(g);
      };
    });
    return;
  }
  g.padEl.style.display = 'grid';
  if (g.q.kind === 'py') {                        // 拼音模式：4 个汉字选项
    g.padEl.style.gridTemplateColumns = 'repeat(4, 1fr)';
    g.q.opts.forEach(ch => {
      const k = document.createElement('div');
      k.className = 'key charKey' + (g.pick === ch ? ' sel' : '');
      k.textContent = ch;
      k.onclick = () => { if (g.done || g.lock || finished) return; g.pick = ch; render(g); };
      g.padEl.appendChild(k);
    });
    return;
  }
  let padMax = MAXN;
  if (MODE === 'custom' && customQ) {
    const nums = [g.q.top, g.q.answer, ...(g.q.parts || [])].filter(x => x !== null && x !== undefined && !isNaN(x));
    padMax = Math.max(MAXN, ...nums);
  }
  const compact = padMax > 10;
  g.padEl.classList.toggle('compact', compact);
  g.padEl.style.gridTemplateColumns = compact ? 'repeat(10, 1fr)' : 'repeat(5, 1fr)';
  for (let n = 1; n <= padMax; n++) {
    const k = document.createElement('div');
    k.className = 'key' + (g.pick === n ? ' sel' : '');
    k.textContent = n;
    k.onclick = () => { if (g.done || g.lock || finished) return; g.pick = n; render(g); };
    g.padEl.appendChild(k);
  }
}
function render(g) {
  g.qEl.innerHTML = diagramHTML(g);
  renderPad(g);
  g.okEl.disabled = g.q.kind === 'pyblend'
    ? !(g.pickSm && g.pickYm && g.pickTone)
    : g.pick === null;
  if (g.helpEl) {
    const py = !!g.q.kind;
    g.helpEl.style.display = py ? 'none' : '';
    g.helpEl.disabled = py || !!g.done || !!g.lock || finished;
  }
}
/* 自定义题工厂：只填总数时，每道题随机生成一个分与合组合。
   总数 1 只有 0+1 一种组合，固定留空第二个部分。 */
function makeCustomQuestion() {
  if (customQ.random) {
    const total = customQ.top;
    const a = total <= 1 ? 0 : rnd(1, total - 1);
    const b = total - a;
    const blankSecond = total <= 1 ? true : Math.random() < 0.5;
    return { top: total, parts: blankSecond ? [a, null] : [null, b], answer: blankSecond ? b : a, flip: false };
  }
  return {
    top: customQ.top,
    parts: [customQ.parts[0], customQ.parts[1]],
    answer: customQ.answer,
    flip: Math.random() < 0.5
  };
}
function resetGroup(g) {
  closeHelpIf(g);
  g.lock = false;
  g.pickSm = null; g.pickYm = null; g.pickTone = null; g.showPy = false;
  g.q = (MODE === 'custom' && customQ) ? makeCustomQuestion() : uniqueQuestion();
  g.pick = null; render(g);
}

/* ---------------- 提交判定 ---------------- */
let finished = false;
function submit(g) {
  if (g.done || g.lock || finished) return;
  if (g.q.kind === 'pyblend') { if (!g.pickSm || !g.pickYm || !g.pickTone) return; }
  else if (g.pick === null) return;
  g.lock = true;
  g.okEl.disabled = true;
  const ok = g.q.kind === 'pyblend'
    ? (g.pickSm === g.q.sm && g.pickYm === g.q.ym && g.pickTone === g.q.tone)
    : (g.pick === g.q.answer);
  if (ok) {
    beep(true);
    if (g.q.kind === 'py' || g.q.kind === 'pyblend') speak(g.q.char);  // 拼音答对：点读该字巩固发音
    g.el.classList.add('right');
    g.progress = Math.min(STEPS, g.progress + 1);
    g.scEl.innerHTML = `${g.progress}<small>/10</small>`;
    g.runEl.classList.remove('run'); void g.runEl.offsetWidth; g.runEl.classList.add('run');
    g.runEl.style.left = (START + g.progress * stepPx) + 'px';
    const p = document.createElement('div');
    p.className = 'plus'; p.textContent = '+1';
    p.style.left = (START + g.progress * stepPx + 12) + 'px';
    p.style.top = (g.runEl.parentElement.offsetTop + 16) + 'px';
    lanesEl.appendChild(p);
    setTimeout(() => p.remove(), 1100);
    const timer = setTimeout(() => { g.el.classList.remove('right'); resetGroup(g); }, 700);
    qTimers.set(g, timer);
    if (g.progress >= STEPS) { g.done = true; setTimeout(() => win(g), 900); }
  } else {
    beep(false);
    g.el.classList.add('wrong');
    if (MODE === 'challenge' && g.progress > 0) {          // 挑战模式：答错后退一格
      g.progress -= 1;
      g.scEl.innerHTML = `${g.progress}<small>/10</small>`;
      g.runEl.style.left = (START + g.progress * stepPx) + 'px';
      const m = document.createElement('div');
      m.className = 'plus minus'; m.textContent = '-1';
      m.style.left = (START + g.progress * stepPx + 12) + 'px';
      m.style.top = (g.runEl.parentElement.offsetTop + 16) + 'px';
      lanesEl.appendChild(m);
      setTimeout(() => m.remove(), 1100);
    }
    const timer = setTimeout(() => {
      g.el.classList.remove('wrong');
      g.lock = false;                                   // 答错后解锁，否则这组再也答不了题
      g.pick = null; g.pickSm = null; g.pickYm = null; g.pickTone = null; render(g);
    }, 620);
    qTimers.set(g, timer);
  }
}

/* ---------------- 结算 ---------------- */
function win(g, reason) {
  if (finished) return; finished = true;
  closeHelp();
  stopTimer();
  GROUPS.forEach(group => { if (qTimers.has(group)) clearTimeout(qTimers.get(group)); });
  document.querySelector('#maskWin .win-txt').textContent =
    reason === 'tie' ? '时间到 · 平局' : reason === 'time' ? '时间到 · 领先小组' : '冠军小组';
  document.getElementById('winName').textContent =
    g ? `${g.no}号 ${g.name}组` : reason === 'tie' ? '多个小组并列领先' : '无人冲线';
  const rank = [...GROUPS].sort((a, b) => b.progress - a.progress);
  document.getElementById('rankList').innerHTML =
    rank.map((x, i) => `<div class="rk">${['🥇','🥈','🥉','4️⃣'][i]} ${x.no}号${x.name} · ${x.progress}/10</div>`).join('');
  document.getElementById('maskWin').classList.add('show');
}

/* ---------------- 计时器 ---------------- */
let timerId = null, timeLeft = 0;
const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
function startTimer(sec) {
  stopTimer();
  timeLeft = sec; timerEl.classList.add('on'); updateTimer();
  timerId = setInterval(() => { timeLeft--; updateTimer(); if (timeLeft <= 0) endByTime(); }, 1000);
}
function updateTimer() {
  timerEl.querySelector('b').textContent = fmt(Math.max(0, timeLeft));
  timerEl.classList.toggle('urgent', timeLeft <= 15);
}
function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } timerEl.classList.remove('on', 'urgent'); }
function endByTime() {
  stopTimer();
  const rank = [...GROUPS].sort((a, b) => b.progress - a.progress);
  const tied = rank[0].progress > 0 && rank[1] && rank[1].progress === rank[0].progress;
  win(tied ? null : rank[0].progress > 0 ? rank[0] : null, tied ? 'tie' : 'time');
}

document.getElementById('cqApply').onclick = () => {
  const val = id => { const s = document.getElementById(id).value.trim(); return s === '' ? null : parseInt(s, 10); };
  const top = val('cqTop'), a = val('cqA'), b = val('cqB');
  const tip = document.getElementById('cqTip');
  const err = msg => { tip.textContent = msg; tip.className = 'tip err'; };

  // 三格都留空：不设置自定义题，使用系统题目
  if (top === null && a === null && b === null) {
    customQ = null;
    tip.innerHTML = TIP_DEFAULT; tip.className = 'tip';
    maskCustom.classList.remove('show');
    MODE = 'practice';
    bannerEl.innerHTML = bannerFor('practice');
    syncTabs();
    resetAll();
    return;
  }
  if ([top, a, b].some(x => x !== null && (isNaN(x) || x < 0 || x > 20))) {
    return err('数字只能在 0 – 20 之间。');
  }
  if (top !== null && top < 1) return err('总数要在 1 – 20 之间。');

  // 只填总数：每次随机生成一个分与合组合
  if (top !== null && a === null && b === null) {
    customQ = { top, parts: [null, null], answer: null, random: true };
    tip.innerHTML = TIP_DEFAULT; tip.className = 'tip';
    maskCustom.classList.remove('show');
    finished = false;
    GROUPS.forEach(g => { g.done = false; resetGroup(g); });
    return;
  }

  if ([top, a, b].filter(x => x === null).length !== 1) {
    return err('请只留空一格（学生要填的那格）；只填总数时，两个部分都留空；三格都留空则使用系统题目。');
  }
  let q = null;
  if (top === null) {
    if (a + b > 20 || a + b < 1) return err('两个部分数之和要 ≥ 1 且 ≤ 20。');
    q = { top: null, parts: [a, b], answer: a + b };
  } else if (a === null) {
    if (b >= top) return err('部分数必须小于总数 ' + top + '。');
    q = { top, parts: [null, b], answer: top - b };
  } else {
    if (a >= top) return err('部分数必须小于总数 ' + top + '。');
    q = { top, parts: [a, null], answer: top - a };
  }
  customQ = q;
  tip.innerHTML = TIP_DEFAULT; tip.className = 'tip';
  maskCustom.classList.remove('show');
  finished = false;
  GROUPS.forEach(g => { g.done = false; resetGroup(g); });   // 换题不重置比分
};

let sndOn = true, ac = null;
document.getElementById('btnSound').onclick = e => {

function beep(ok) {
  if (!sndOn) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const notes = ok ? [660, 880] : [220, 165];
    notes.forEach((f, i) => {
      const o = ac.createOscillator(), gn = ac.createGain();
      o.type = ok ? 'triangle' : 'sawtooth';
      o.frequency.value = f;
      gn.gain.setValueAtTime(0.0001, ac.currentTime + i * 0.12);
      gn.gain.exponentialRampToValueAtTime(0.18, ac.currentTime + i * 0.12 + 0.02);
      gn.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + i * 0.12 + 0.16);
      o.connect(gn).connect(ac.destination);
      o.start(ac.currentTime + i * 0.12); o.stop(ac.currentTime + i * 0.12 + 0.2);
    });
  } catch (e) {}
}

const HELP_SIDE = ['left', 'right'];
let helpGroup = null;

function helpModeOf(q) { return q.top !== null ? 'fen' : 'he'; }
function helpOpenState(g) {
  const q = g.q;
  return q.top !== null
    ? { top: q.top, left: 0, right: 0 }
    : { top: 0, left: q.parts[0], right: q.parts[1] };

function helpSolved() {
  if (!helpGroup) return false;
  const q = helpGroup.q;
  if (helpModeOf(q) === 'fen') {
    const knownIdx = q.parts[0] === null ? 1 : 0;
    return helpState.top === 0
      && helpState[HELP_SIDE[knownIdx]] === q.parts[knownIdx]
      && helpState[HELP_SIDE[1 - knownIdx]] === q.answer;
  }
  return helpState.left === 0 && helpState.right === 0 && helpState.top === q.answer;
}
function carrotHTML(n, zone) {

}
function renderHelp() {
  if (!helpGroup) return;
  const q = helpGroup.q;
  const mode = helpModeOf(q);
  const knownIdx = q.parts[0] === null ? 1 : 0;
  const knownVal = q.parts[knownIdx];
  const knownSide = HELP_SIDE[knownIdx];
  const otherSide = HELP_SIDE[1 - knownIdx];
  const sideName = s => s === 'left' ? '左边' : '右边';
  // 问号格只显示 ?，哪怕拖入萝卜也不显示数字，让小朋友自己数
  const zone = (key, big, label, cls) => `
    <div class="help-zone ${cls || ''}" data-zone="${key}">
      <div class="help-zone-head"><b>${big}</b><span>${label}</span></div>
      <div class="help-carrots">${carrotHTML(helpState[key], key)}</div>
    </div>`;
  let topZone, leftZone, rightZone;
  if (mode === 'fen') {
    topZone = zone('top', q.top, '总数');
    const knownJar = zone(knownSide, knownVal, sideName(knownSide), 'known');
    const unknownJar = zone(otherSide, '?', '数一数', 'unknown');
    leftZone = knownSide === 'left' ? knownJar : unknownJar;
    rightZone = knownSide === 'left' ? unknownJar : knownJar;
  } else {
    topZone = zone('top', '?', '一共几个？');
    // 罐子上的数字始终对应原题，拖走胡萝卜后也不变
    leftZone = zone('left', q.parts[0], '左边');
    rightZone = zone('right', q.parts[1], '右边');
  }
  // 右侧操作区跟随题图方向：分→合时两个罐子在上、总数在下；合→分时总数在上
  const jarsRow = `<div class="help-jars">${leftZone}${rightZone}</div>`;
  const totalRow = `<div class="help-total ${q.flip ? 'after' : 'before'}">${topZone}</div>`;
  helpBody.innerHTML = `<div class="help-main">
    <div class="help-question">
      <div class="help-question-label">原题</div>
      <div class="help-question-img">${diagram(q, null, null, null, null, false)}</div>
    </div>
    <div class="help-panel">
      ${q.flip ? jarsRow + totalRow : totalRow + jarsRow}
    </div>
  </div>`;
  if (helpSolved()) helpBody.querySelectorAll('.help-zone').forEach(z => z.classList.add('solved'));
  const totalPos = q.flip ? '下面' : '上面';
  helpTipEl.textContent = mode === 'fen'
    ? `把${totalPos}的 ${q.top} 个红萝卜拖进罐子：${sideName(knownSide)}放 ${knownVal} 个，${sideName(otherSide)}放剩下的。`
    : `把两个罐子里的红萝卜都拖到${totalPos}，数一数一共几个。`;
}
function helpZoneAt(x, y) {
  const el = document.elementFromPoint(x, y);
  return el ? el.closest('.help-zone') : null;
}
function helpPlaceGhost(e) {
  if (!helpDrag) return;
  const gh = helpDrag.ghost;
  const r = board.getBoundingClientRect();
  const s = r.width / 1920;
  gh.style.left = ((e.clientX - r.left) / s) + 'px';
  gh.style.top = ((e.clientY - r.top) / s) + 'px';
}
function helpPointerDown(e) {
  const c = e.target.closest('.help-carrot');
  if (!c || !helpGroup) return;
  const zone = c.dataset.zone;
  if (!helpState[zone]) return;
  e.preventDefault();
  const ghost = document.createElement('div');
  ghost.className = 'help-carrot-ghost';
  ghost.innerHTML = CARROT_SVG;
  board.appendChild(ghost);
  helpDrag = { zone, ghost, src: c };
  c.classList.add('dragging');
  helpPlaceGhost(e);
  document.addEventListener('pointermove', helpPointerMove);
  document.addEventListener('pointerup', helpPointerUp);
  document.addEventListener('pointercancel', helpPointerUp);
}
function helpPointerMove(e) {
  if (!helpDrag) return;
  helpPlaceGhost(e);
  document.querySelectorAll('.help-zone.drop-hover').forEach(z => z.classList.remove('drop-hover'));
  const z = helpZoneAt(e.clientX, e.clientY);
  if (z) z.classList.add('drop-hover');
}
function helpPointerUp(e) {
  document.removeEventListener('pointermove', helpPointerMove);
  document.removeEventListener('pointerup', helpPointerUp);
  document.removeEventListener('pointercancel', helpPointerUp);
  if (!helpDrag) return;
  const drag = helpDrag;
  helpDrag = null;
  drag.ghost.remove();
  drag.src.classList.remove('dragging');
  document.querySelectorAll('.help-zone.drop-hover').forEach(z => z.classList.remove('drop-hover'));
  const target = helpZoneAt(e.clientX, e.clientY);
  if (!target) { renderHelp(); return; }
  const to = target.dataset.zone;
  if (to === drag.zone || !helpState[drag.zone]) { renderHelp(); return; }
  helpState[drag.zone]--;
  helpState[to]++;
  if (helpSolved()) beep(true);
  renderHelp();
}
function openHelp(g) {
  if (!g || !g.q || g.q.kind || g.done || g.lock || finished) return;
  helpGroup = g;
  helpState = helpOpenState(g);
  helpMask.classList.add('show');
  renderHelp();
}
function closeHelp() {
  helpMask.classList.remove('show');
  helpGroup = null;
  helpDrag = null;
  document.querySelectorAll('.help-carrot-ghost').forEach(x => x.remove());
  document.querySelectorAll('.help-zone.drop-hover').forEach(x => x.classList.remove('drop-hover'));
}
function closeHelpIf(g) { if (helpGroup === g) closeHelp(); }
helpBody.addEventListener('pointerdown', helpPointerDown);
document.getElementById('helpClose').onclick = closeHelp;
document.getElementById('helpDone').onclick = closeHelp;
document.getElementById('helpReset').onclick = () => {
  if (!helpGroup) return;
  helpState = helpOpenState(helpGroup);
  renderHelp();
};
helpMask.addEventListener('click', e => { if (e.target === helpMask) closeHelp(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && helpGroup) closeHelp(); });

/* ---------------- 学习分类切换 + 拼音表 ---------------- */
const maskChart = document.getElementById('chartMask');
function buildChart() {
  const card = (big, small, say, cls, kind, key) =>
    `<div class="c-card ${cls || ''}" data-say="${say}"${kind ? ` data-kind="${kind}" data-key="${key || big}"` : ''}><b>${big}</b><span>${small}</span></div>`;
  let html = '<h4>声母（23 个 · 点击听呼读音）</h4><div class="c-grid">'
    + SM_LIST.map(([s, c]) => card(s, c, c, '', 'sm', s)).join('') + '</div>';
  YM_GROUPS.forEach(([name, arr]) => {
    html += `<h4>${name}</h4><div class="c-grid">`
      + arr.map(([y, c]) => card(y, c, c, '', 'ym', y)).join('') + '</div>';
  });
  html += '<h4>四声练习（m + a · 点击听读音）</h4><div class="c-grid">'
    + [['妈','mā · 第一声',1],['麻','má · 第二声',2],['马','mǎ · 第三声',3],['骂','mà · 第四声',4]]
        .map(([c, d]) => card(c, d, c, 'tone')).join('') + '</div>';
  html += '<h4>常用字点读表（一年级）</h4><div class="c-grid">'
    + CHARS.map(x => card(x.c, x.p, x.c, 'zi')).join('') + '</div>';
  document.getElementById('chartBody').innerHTML = html;
}
buildChart();
document.getElementById('btnChart').onclick = () => maskChart.classList.add('show');
document.getElementById('chartClose').onclick = () => maskChart.classList.remove('show');
document.getElementById('chartFs').onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
};
maskChart.addEventListener('click', e => {
  const t = e.target.closest('[data-say]');
  if (!t) return;
  if (t.dataset.kind) playPinyinSound(t.dataset.kind, t.dataset.key, t.dataset.say);
  else speak(t.dataset.say);
});

const subjectSel = document.getElementById('subjectSel');
subjectSel.onchange = () => setSubject(subjectSel.value);
/* 让下拉框与当前科目+模式保持一致（拼音·拼写练习 = 拼音科目 + pyblend 模式） */
function syncSubjSel() {
  subjectSel.value = (SUBJECT === 'pinyin' && MODE === 'pyblend') ? 'pinyin-blend' : SUBJECT;
}
function setSubject(s) {
  const blend = s === 'pinyin-blend';
  if (blend) s = 'pinyin';
  SUBJECT = s;
  customQ = null;
  document.getElementById('diff').style.display = s === 'pinyin' ? 'none' : 'flex';
  document.querySelector('.tab[data-mode="custom"]').style.display = s === 'pinyin' ? 'none' : '';
  document.getElementById('btnChart').style.display = s === 'pinyin' ? 'flex' : 'none';
  if (blend)                                                        MODE = 'pyblend';
  else if (s === 'pinyin' && (MODE === 'custom' || MODE === 'pyblend')) MODE = 'practice';
  else if (s === 'math' && MODE === 'pyblend')                      MODE = 'practice';
  syncTabs();
  bannerEl.innerHTML = bannerFor(MODE);
  syncSubjSel();
  resetAll();
}

/* ---------------- 启动 ---------------- */
loadAvatars();
GROUPS.forEach(paintAvatar);
GROUPS.forEach(resetGroup);
</script>
